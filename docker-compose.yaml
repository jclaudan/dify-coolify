# documentation: https://docs.dify.ai
# slogan: Open-source LLM application development platform with RAG, agents, and workflows
# tags: ai,llm,rag,workflow,vector-database,open-source
# logo: svgs/dify.svg
# port: 3000
#
# Configuration Dify pour Coolify
# IMPORTANT: Ce fichier doit être à la racine du repository pour Coolify
# Les chemins relatifs pointent vers la racine car le fichier est à la racine

x-shared-env: &shared-api-worker-env
  # URLs - Générées automatiquement par Coolify
  # Coolify génère automatiquement SERVICE_URL_API_5001 et SERVICE_URL_WEB_3000
  # quand vous assignez des domaines aux services dans l'interface Coolify
  CONSOLE_API_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${CONSOLE_API_URL:?}}}
  CONSOLE_WEB_URL: ${SERVICE_URL_WEB_3000:-${SERVICE_URL_WEB:-${CONSOLE_WEB_URL:?}}}
  SERVICE_API_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${APP_API_URL:?}}}
  APP_API_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${APP_API_URL:?}}}
  APP_WEB_URL: ${SERVICE_URL_WEB_3000:-${SERVICE_URL_WEB:-${APP_WEB_URL:?}}}
  FILES_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${FILES_URL:?}}}
  INTERNAL_FILES_URL: http://api:5001
  
  # Configuration générale
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SERVICE_BASE64_DIFY:-${SERVICE_PASSWORD_SECRET:-${SECRET_KEY:?}}}
  INIT_PASSWORD: ${INIT_PASSWORD:-${SERVICE_PASSWORD_INIT:-}}
  CHECK_UPDATE_URL: ${CHECK_UPDATE_URL:-https://updates.dify.ai}
  OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
  MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}
  
  # Configuration Base de données PostgreSQL
  DB_USERNAME: ${SERVICE_USER_DB:-${DB_USERNAME:-postgres}}
  DB_PASSWORD: ${SERVICE_PASSWORD_DB:?}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-dify}
  SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-30}
  SQLALCHEMY_MAX_OVERFLOW: ${SQLALCHEMY_MAX_OVERFLOW:-10}
  
  # Configuration Redis
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS:?}
  REDIS_DB: ${REDIS_DB:-0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${SERVICE_PASSWORD_REDIS:?}@redis:6379/1}
  CELERY_BACKEND: ${CELERY_BACKEND:-redis}
  
  # Configuration CORS
  WEB_API_CORS_ALLOW_ORIGINS: ${WEB_API_CORS_ALLOW_ORIGINS:-*}
  CONSOLE_CORS_ALLOW_ORIGINS: ${CONSOLE_CORS_ALLOW_ORIGINS:-*}
  
  # Configuration Stockage
  STORAGE_TYPE: ${STORAGE_TYPE:-opendal}
  OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
  OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
  
  # Configuration Vector Store (Qdrant)
  VECTOR_STORE: ${VECTOR_STORE:-qdrant}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${SERVICE_PASSWORD_QDRANT:?}
  
  # Configuration ETL
  ETL_TYPE: ${ETL_TYPE:-dify}
  UNSTRUCTURED_API_URL: ${UNSTRUCTURED_API_URL:-}
  UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
  
  # Configuration Email - Resend
  MAIL_TYPE: ${MAIL_TYPE:-resend}
  MAIL_DEFAULT_SEND_FROM: ${MAIL_DEFAULT_SEND_FROM:-your-email@yourdomain.com}
  RESEND_API_KEY: ${RESEND_API_KEY:-your-resend-api-key-here}
  SMTP_SERVER: ${SMTP_SERVER:-smtp.resend.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USERNAME: ${SMTP_USERNAME:-resend}
  SMTP_PASSWORD: ${SERVICE_PASSWORD_SMTP:-${SMTP_PASSWORD:-}}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  
  # Configuration Sandbox
  CODE_EXECUTION_ENDPOINT: ${CODE_EXECUTION_ENDPOINT:-http://sandbox:8194}
  CODE_EXECUTION_API_KEY: ${SERVICE_BASE64_SANDBOX:-${SERVICE_PASSWORD_SANDBOX:-${SANDBOX_API_KEY:?}}}
  SANDBOX_API_KEY: ${SERVICE_BASE64_SANDBOX:-${SERVICE_PASSWORD_SANDBOX:-${SANDBOX_API_KEY:?}}}
  SANDBOX_PORT: ${SANDBOX_PORT:-8194}
  
  # Configuration Plugin Daemon
  DB_PLUGIN_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
  PLUGIN_DAEMON_PORT: ${PLUGIN_DAEMON_PORT:-5002}
  PLUGIN_DAEMON_KEY: ${SERVICE_BASE64_PLUGIN:-${SERVICE_PASSWORD_PLUGIN:-${PLUGIN_DAEMON_KEY:?}}}
  PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
  PLUGIN_DIFY_INNER_API_KEY: ${SERVICE_BASE64_PLUGIN_INNER:-${SERVICE_PASSWORD_PLUGIN_INNER:-${PLUGIN_DIFY_INNER_API_KEY:?}}}
  PLUGIN_DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
  
  # Configuration Marketplace
  MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
  PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
  
  # Configuration Plugin Storage
  PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
  PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
  EXPOSE_PLUGIN_DEBUGGING_PORT: ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}
  PLUGIN_DEBUGGING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
  PLUGIN_DEBUGGING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
  PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}

# Docker DNS resolver pour Coolify (force l'utilisation du DNS embarqué de Docker)
x-docker-resolver: &docker-internal-resolver
  dns:
    - 127.0.0.11

services:
  # API service
  api:
    <<: *docker-internal-resolver
    image: langgenius/dify-api:1.9.2
    restart: always
    expose:
      - "5001"
    environment:
      <<: *shared-api-worker-env
      MODE: api
      INNER_API_KEY_FOR_PLUGIN: ${SERVICE_BASE64_PLUGIN_INNER:-${SERVICE_PASSWORD_PLUGIN_INNER:-${PLUGIN_DIFY_INNER_API_KEY:?}}}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_APP:-./volumes/app/storage}
        target: /app/api/storage
        is_directory: true
    networks:
      - ssrf_proxy_network
      - default

  # worker service
  worker:
    <<: *docker-internal-resolver
    image: langgenius/dify-api:1.9.2
    restart: always
    environment:
      <<: *shared-api-worker-env
      MODE: worker
      INNER_API_KEY_FOR_PLUGIN: ${SERVICE_BASE64_PLUGIN_INNER:-${SERVICE_PASSWORD_PLUGIN_INNER:-${PLUGIN_DIFY_INNER_API_KEY:?}}}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_APP:-./volumes/app/storage}
        target: /app/api/storage
        is_directory: true
    networks:
      - ssrf_proxy_network
      - default

  # worker_beat service
  worker_beat:
    <<: *docker-internal-resolver
    image: langgenius/dify-api:1.9.2
    restart: always
    environment:
      <<: *shared-api-worker-env
      MODE: beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ssrf_proxy_network
      - default

  # Frontend web application
  web:
    <<: *docker-internal-resolver
    image: langgenius/dify-web:1.9.2
    restart: always
    expose:
      - "3000"
    environment:
      CONSOLE_API_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${CONSOLE_API_URL:?}}}
      APP_API_URL: ${SERVICE_URL_API_5001:-${SERVICE_URL_API:-${APP_API_URL:?}}}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      
  # The postgres database
  db:
    <<: *docker-internal-resolver
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${SERVICE_USER_DB:-${DB_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB:?}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_DB:-./volumes/db/data}
        target: /var/lib/postgresql/data
        is_directory: true
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -h localhost -U ${SERVICE_USER_DB:-${DB_USERNAME:-postgres}} -d ${DB_DATABASE:-dify}"
      interval: 5s
      timeout: 5s
      retries: 60

  # The redis cache
  redis:
    <<: *docker-internal-resolver
    image: redis:6-alpine
    restart: always
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_REDIS:-./volumes/redis/data}
        target: /data
        is_directory: true
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS:?}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a ${SERVICE_PASSWORD_REDIS:?} ping | grep -q PONG"
      interval: 5s
      timeout: 3s
      retries: 5

  # The DifySandbox
  sandbox:
    <<: *docker-internal-resolver
    image: langgenius/dify-sandbox:0.2.12
    restart: always
    environment:
      API_KEY: ${SERVICE_BASE64_SANDBOX:-${SERVICE_PASSWORD_SANDBOX:-${SANDBOX_API_KEY:?}}}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-}
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_SANDBOX_DEPS:-./volumes/sandbox/dependencies}
        target: /dependencies
        is_directory: true
      - type: bind
        source: ${COOLIFY_VOLUME_SANDBOX_CONF:-./volumes/sandbox/conf}
        target: /conf
        is_directory: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssrf_proxy_network

  # plugin daemon
  plugin_daemon:
    <<: *docker-internal-resolver
    image: langgenius/dify-plugin-daemon:0.3.0-local
    restart: always
    environment:
      <<: *shared-api-worker-env
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${SERVICE_BASE64_PLUGIN:-${SERVICE_PASSWORD_PLUGIN:-${PLUGIN_DAEMON_KEY:?}}}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${SERVICE_BASE64_PLUGIN_INNER:-${SERVICE_PASSWORD_PLUGIN_INNER:-${PLUGIN_DIFY_INNER_API_KEY:?}}}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
    ports:
      - "${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_PLUGIN:-./volumes/plugin_daemon}
        target: /app/storage
        is_directory: true
    depends_on:
      db:
        condition: service_healthy

  # ssrf_proxy server
  ssrf_proxy:
    <<: *docker-internal-resolver
    image: ubuntu/squid:latest
    restart: always
    volumes:
      - type: bind
        source: ./ssrf_proxy/squid.conf.template
        target: /etc/squid/squid.conf.template
      - type: bind
        source: ./ssrf_proxy/docker-entrypoint.sh
        target: /docker-entrypoint-mount.sh
    entrypoint:
      - "sh"
      - "-c"
      - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      HTTP_PORT: 3128
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: 8194
    networks:
      - ssrf_proxy_network
      - default

  # The nginx reverse proxy
  nginx:
    <<: *docker-internal-resolver
    image: nginx:latest
    restart: always
    volumes:
      - type: bind
        source: ./nginx/nginx.conf.template
        target: /etc/nginx/nginx.conf.template
      - type: bind
        source: ./nginx/proxy.conf.template
        target: /etc/nginx/proxy.conf.template
      - type: bind
        source: ./nginx/https.conf.template
        target: /etc/nginx/https.conf.template
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        is_directory: true
      - type: bind
        source: ./nginx/docker-entrypoint.sh
        target: /docker-entrypoint-mount.sh
      - type: bind
        source: ./nginx/ssl
        target: /etc/ssl
        is_directory: true
    entrypoint:
      - "sh"
      - "-c"
      - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTPS_ENABLED: ${NGINX_HTTPS_ENABLED:-false}
      NGINX_SSL_PORT: ${NGINX_SSL_PORT:-443}
      NGINX_PORT: ${NGINX_PORT:-80}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:-dify.crt}
      NGINX_SSL_CERT_KEY_FILENAME: ${NGINX_SSL_CERT_KEY_FILENAME:-dify.key}
      NGINX_SSL_PROTOCOLS: ${NGINX_SSL_PROTOCOLS:-TLSv1.1 TLSv1.2 TLSv1.3}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_KEEPALIVE_TIMEOUT: ${NGINX_KEEPALIVE_TIMEOUT:-65}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-3600s}
      NGINX_ENABLE_CERTBOT_CHALLENGE: ${NGINX_ENABLE_CERTBOT_CHALLENGE:-false}
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-}
    depends_on:
      - api
      - web
    ports:
      - "${EXPOSE_NGINX_PORT:-3000}:${NGINX_PORT:-80}"
      - "${EXPOSE_NGINX_SSL_PORT:-3443}:${NGINX_SSL_PORT:-443}"

  # Qdrant vector store
  qdrant:
    <<: *docker-internal-resolver
    image: langgenius/qdrant:v1.7.3
    restart: always
    volumes:
      - type: bind
        source: ${COOLIFY_VOLUME_QDRANT:-./volumes/qdrant}
        target: /qdrant/storage
        is_directory: true
    environment:
      QDRANT_API_KEY: ${SERVICE_PASSWORD_QDRANT:?}

networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  default:
    driver: bridge

volumes: {}
